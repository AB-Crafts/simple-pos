name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Installer & Portable Executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies (better-sqlite3) for Windows Electron
        run: npm run rebuild

      - name: Build frontend and backend
        run: npm run build

      - name: Package Windows application (NSIS & Portable)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect generated artifacts
        shell: pwsh
        run: |
          Write-Host "Generated build files in release directory:"
          Get-ChildItem -Path release -Filter *.exe | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: Banu-Pyala-POS-Windows
          path: |
            release/*.exe
          if-no-files-found: error
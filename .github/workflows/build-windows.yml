name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Installer & Portable Executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
          msbuild -version

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3 --verbose

      - name: Verify Electron and native SQLite versions
        run: |
          npm list electron better-sqlite3 @electron/rebuild

      - name: Build frontend and backend
        run: npm run build

      - name: Package Windows application
        run: npx electron-builder --win --x64 -c.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect generated artifacts
        shell: pwsh
        run: |
          Write-Host "Generated build files in release directory:"
          if (-not (Test-Path release)) {
            Write-Error "release directory was not created."
            exit 1
          }

          Get-ChildItem -Path release -Filter *.exe |
            Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: Banu-Pyala-POS-Windows
          path: release/*.exe
          if-no-files-found: error